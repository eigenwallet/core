name: "Create 'preview' release"

on:
  schedule:
    # We release a preview release every day at noon UTC
    - cron: '0 12 * * *'
  # Allow manually triggering the workflow
  workflow_dispatch:

concurrency:
  group: preview-release
  cancel-in-progress: true

jobs:
  create_release:
    name: Create preview release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - uses: actionhippie/swap-space@0cffa893f224708cfb6b011690d8ba819d69c10f
        with:
          size: 15G

      - name: Delete 'preview' release
        uses: larryjoelane/delete-release-action@f0d7056780073e50383f9fec730827292c6bb266
        with:
          release-name: preview
          token: ${{ secrets.BOTTY_GITHUB_TOKEN }}

      - name: Give GitHub some time to process the deletion, otherwise our release shows up as draft. Sigh.
        run: sleep 10

      - name: Extract changelog section for release
        id: changelog
        uses: coditory/changelog-parser@4f567c6914ee75eff434b4d946393dfd254f8f98
        with:
          version: unreleased

      - name: Create 'preview' release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e
        env:
          GITHUB_TOKEN: ${{ secrets.BOTTY_GITHUB_TOKEN }}
        with:
          tag_name: preview
          release_name: preview
          draft: false
          prerelease: true
          body: ${{ steps.changelog.outputs.description }}
