[package]
name = "killswitch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "killswitch"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
libc = "0.2"
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
